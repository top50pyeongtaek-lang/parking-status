<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공영주차장 잔여 면수 안내</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 36px 16px;
      margin: 0;
    }
    .card {
      max-width: 480px;
      margin: 0 auto 16px;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px 18px;
    }
    .name {
      font-size: 20px;
      font-weight: bold;
    }
    .num {
      font-size: 44px;
      font-weight: 800;
      color: #4ade80;
      margin-top: 10px;
    }
    .sub {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h2>실시간 공영주차장 잔여 면수</h2>

  <div class="card">
    <div class="name">JC공원지하주차장</div>
    <div class="num" id="jc">- 면</div>
    <div class="sub">경기 평택시 평택동 38</div>
  </div>

  <div class="card">
    <div class="name">자란공영주차장</div>
    <div class="num" id="jaran">- 면</div>
    <div class="sub">경기 평택시 비전동 632-12 일대</div>
  </div>

  <p class="sub">페이지 연결 확인용 화면입니다.</p>
</body>
</html>
