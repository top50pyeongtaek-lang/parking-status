<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공영주차장 잔여 면수 안내</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 28px 16px;
      margin: 0;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    .time {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .card {
      max-width: 480px;
      margin: 0 auto 16px;
      background: #1e293b;
      border-radius: 16px;
      padding: 22px 18px;
    }
    .name {
      font-size: 20px;
      font-weight: 700;
    }
    .num {
      font-size: 46px;
      font-weight: 800;
      color: #4ade80;
      margin: 10px 0 6px;
    }
    .sub {
      font-size: 13px;
      color: #94a3b8;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h2>실시간 공영주차장 잔여 면수</h2>
  <div class="time" id="updated">불러오는 중...</div>

  <div class="card">
    <div class="name">JC공원지하주차장</div>
    <div class="num" id="jc">- 면</div>
    <div class="sub" id="jc-detail">경기 평택시 평택1로20번길 6 (평택동)</div>
  </div>

  <div class="card">
    <div class="name">자란공영주차장</div>
    <div class="num" id="jaran">- 면</div>
    <div class="sub" id="jaran-detail">경기 평택시 비전동 632-12 일대</div>
  </div>

  <button type="button" onclick="loadAll()">새로고침</button>

  <script>
    const WORKER_BASE = "https://blue-heart-faaf.top50pyeongtaek.workers.dev";

    async function fetchParking(parkingId) {
      const res = await fetch(`${WORKER_BASE}/?id=${encodeURIComponent(parkingId)}`);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      return data?.operating?.result || null;
    }

    async function updateCard(parkingId, numId, detailId) {
      const numEl = document.getElementById(numId);
      const detailEl = document.getElementById(detailId);
      numEl.innerText = "...";
      try {
        const info = await fetchParking(parkingId);
        if (info && info.CURRENT_CNT !== undefined) {
          numEl.innerText = `${info.CURRENT_CNT} 면`;
          const addr = info.CELL_ADDR_LOAD || info.CELL_ADDR_JIBUN || "";
          const total = info.SUM_CELL_CNT ?? info.CELL_CNT;
          detailEl.innerText = total ? `${addr} (총 ${total}면)` : addr;
        } else {
          numEl.innerText = "확인 불가";
        }
      } catch (err) {
        numEl.innerText = "오류";
        detailEl.innerText = err.message;
      }
    }

    async function loadAll() {
      await Promise.all([
        updateCard(185, "jc", "jc-detail"),
        updateCard(27, "jaran", "jaran-detail")
      ]);
      document.getElementById("updated").innerText = "업데이트: " + new Date().toLocaleTimeString("ko-KR");
    }

    loadAll();
  </script>
</body>
</html>
